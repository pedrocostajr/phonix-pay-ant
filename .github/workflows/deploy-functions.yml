name: Deploy Supabase Functions

on:
  push:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v3

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Debug Project ID
        run: |
          echo "Deploying to Project: ${{ secrets.SUPABASE_PROJECT_ID }}"
          echo "Length of Token: ${#SUPABASE_ACCESS_TOKEN}"

      - name: Link Project
        run: supabase link --project-ref $SUPABASE_PROJECT_ID --password ${{ secrets.SUPABASE_DB_PASSWORD }}
        continue-on-error: true

      - name: Push Database Migrations
        run: supabase db push --include-all
        
      - name: Deploy Functions
        run: supabase functions deploy --project-ref $SUPABASE_PROJECT_ID --no-verify-jwt
